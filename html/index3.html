<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade</title>
</head>
<body>
    <p id="saida"></p>
    <script>
    let dia = Number(prompt("Digite o número desejado: "));
    switch (dia) {
    case 1:
        alert("Segunda");
        break;
        case 2:
            alert("Terça");
            break;
                case 3:
                    alert("Quarta");
                            break;
                                default:
                                    alert("Final de semana :D");
}
document.getElementById("saida").innerHTML = "Finalizado";
    </script>
</body>
</html>
