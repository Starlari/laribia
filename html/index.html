<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade</title>
</head>
<body>
    <p id="saida"></p>
    <script>
        let nota = prompt("Digite sua nota: ");
if (nota >= 8){
    alert("Felicidade pura");
}
else if (nota >= 6){
    alert("Sentimento neutro");
}
else{
    alert("Vontade de chorar");
}
document.getElementById("saida").innerHTML = "Finalizado";
    </script>
</body>
</html>
