<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela exemplo</title>
</head>
<body>
    <table border="1">
        <colgroup>
        <col style="background-color: rgb(43, 255, 0);">
        <col style="background-color: rgb(43, 255, 0);">
        <col style="background-color: yellow;">
        <col style="background-color: yellow;">
        </colgroup>
        <caption>Sistema bancário</caption>
        <tr>
            <th>Foto</th>
            <th>Nome</th>
            <th>Poupança</th>
            <th>Corrente</th>
            <th>Site</th>
        </tr>
        <tr>
            <td><img src="gato1.jpg" alt="gato1" width="150"></td>
            <td>Tio Patinhas</td>
            <td>R$ 8000</td>
            <td>R$ 3000</td>
            <td><a href="https://www.bcb.gov.br/" target="_blank">Patinhas.com</a></td>
        </tr>
        <tr>
            <td><img src="gato2.jpg" alt="gato2" width="150"></td>
            <td>Brasil</td>
            <td>R$ 150</td>
            <td>R$ 200</td>
            <td><a href="https://www.bb.com.br/site/pra-voce/desenrola-brasil/" target="_blank">Brasil.com</a></td>
        </tr>
        <tr>
            <td><img src="gato3.jpg" alt="gato3" width="200"></td>
            <td>Master</td>
            <td>R$ 200.000</td>
            <td>R$ 100.000</td>
            <td><a href="https://www.bancomaster.com.br/" target="_blank"><img src="gato4.jpg" width="150"></a></td>
        </tr>
    </table>
</body>
</html>
